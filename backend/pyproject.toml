[project]
name = "portfolio-server"
version = "0.1.0"
description = "Portfolio API, a Python Worker on Cloudflare"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest asserts are the point of a test.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Backend trust boundary: everything a Visitor sends to /api (Contact requests, Chat messages) is
# untrusted. Generic Python security checks (eval, pickle, yaml.load, shell=True, hardcoded
# passwords) are ruff's `S` rules; these cover what is specific to the Worker's handlers: the
# `ROUTES` table, `ApiRequest` / `ApiResponse` and `error_response` (.claude/rules/backend.md).
rules:
  - id: backend-route-outside-api
    languages: [python]
    severity: ERROR
    message: >-
      Route outside /api. Every route in `ROUTES` lives under /api/, so the dev proxy, the static
      assets and the deploy see one prefix.
    metadata:
      category: correctness
    patterns:
      - pattern-inside: |
          ROUTES = {...}
      - pattern: ("$METHOD", "$PATH")
      - metavariable-regex:
          metavariable: $PATH
          regex: ^(?!/api/)
    paths:
      include:
        - /backend/src/

  - id: backend-exception-text-in-response
    languages: [python]
    severity: ERROR
    message: >-
      Exception text sent to the client. It leaks internals (paths, queries, provider errors).
      Send a static message and log the exception server-side.
    metadata:
      category: security
      cwe: "CWE-209: Information Exposure Through an Error Message"
    patterns:
      - pattern-inside: |
          try:
              ...
          except $TYPE as $ERR:
              ...
      - pattern-either:
          - pattern: error_response(..., <... $ERR ...>, ...)
          - pattern: error_response(..., detail=<... $ERR ...>, ...)
          - pattern: json_response(<... $ERR ...>, ...)
          - pattern: ErrorResponse(<... $ERR ...>)
          - pattern: ErrorResponse(..., detail=<... $ERR ...>, ...)
          - pattern: ApiResponse(..., body=<... $ERR ...>, ...)
    paths:
      include:
        - /backend/src/

  - id: backend-request-data-in-outbound-url
    languages: [python]
    severity: ERROR
    message: >-
      Request data flows into an outbound URL (SSRF): a Visitor picks where the Worker connects.
      Outbound URLs come from configuration; request data goes in the body or as escaped query params.
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery"
    mode: taint
    options:
      taint_intrafile: true
    pattern-sources:
      - patterns:
          - pattern-inside: |
              async def $FN(..., $REQ: ApiRequest, ...): ...
          - pattern-either:
              - pattern: $REQ.path
              - pattern: $REQ.headers
              - pattern: $REQ.body
      - patterns:
          - pattern-inside: |
              def $FN(..., $REQ: ApiRequest, ...): ...
          - pattern-either:
              - pattern: $REQ.path
              - pattern: $REQ.headers
              - pattern: $REQ.body
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: pyfetch($URL, ...)
              - pattern: $CLIENT.fetch($URL, ...)
              - pattern: $CLIENT.pyfetch($URL, ...)
              - pattern: urlopen($URL, ...)
              - pattern: $CLIENT.urlopen($URL, ...)
          - focus-metavariable: $URL
    paths:
      include:
        - /backend/src/

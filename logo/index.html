<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16161f">
  <title>Logo</title>
  <link rel="stylesheet" href="./logo.css">
  <script defer src="./logo.js"></script>
  <!-- tuning panel (temporary) -->
  <link rel="stylesheet" href="./panel.css">
  <script defer src="./panel.js"></script>
</head>
<body>
  <main class="stage">
    <svg id="logo" class="logo" viewBox="150 124 434 303" role="img" aria-label="Logo">
      <defs>
        <filter id="logo-glow" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="1.6"/>
        </filter>
        <clipPath id="clip-ring"><path id="clip-ring-shape" clip-rule="evenodd"/></clipPath>
        <clipPath id="clip-line"><path id="clip-line-shape"/></clipPath>
      </defs>
      <!-- glow copies reference the live line groups -->
      <use href="#ring" class="glow" filter="url(#logo-glow)"/>
      <use href="#line" class="glow" filter="url(#logo-glow)"/>
      <g id="ring" clip-path="url(#clip-ring)"><g id="ring-lines" class="weave"></g></g>
      <g id="line" clip-path="url(#clip-line)"><g id="line-lines" class="weave"></g></g>
    </svg>
  </main>
</body>
</html>
